name: Python CI
on:
  push:
    branches: [ main, develop ]
    paths:
      - "multi_agent_trader/**/*.py"
      - "tests/**/*.py"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "multi_agent_trader/**/*.py"
      - "tests/**/*.py"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
         fetch-depth: 0
      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          architecture: x64
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Audit Python dependencies
        run: |
          uv sync --locked
          uv run pip-audit